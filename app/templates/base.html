<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Sync Dashboard v1.3.0</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M6 5h10l3 3v11H5V5h1zm2 0v5h8V5M8 19v-5h8v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="M4 20l4.5-1 9-9a2.2 2.2 0 0 0-3.1-3.1l-9 9L4 20zm10-11l3.1 3.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M9 7V5h6v2m-8 0l1 12h8l1-12M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.2 4.2L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="M8 6l10 6-10 6V6z" fill="currentColor"/>
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M8 6h3v12H8zm5 0h3v12h-3z" fill="currentColor"/>
      </symbol>
      <symbol id="icon-repeat" viewBox="0 0 24 24">
        <path d="M18 8V4l4 4-4 4V8H9a4 4 0 0 0 0 8h2M6 16v4l-4-4 4-4v4h9a4 4 0 0 0 0-8h-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </symbol>
      <symbol id="icon-wand" viewBox="0 0 24 24">
        <path d="M4 20l10-10M14 10l1.5-3L18 5.5 15 4l-1.5-3L12 4l-3 1.5L12 7l1.5 3zM17 17l.8-1.7L19.5 14l-1.7-.8L17 11.5l-.8 1.7L14.5 14l1.7.8L17 17z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <path d="M5 4.5h11a3 3 0 0 1 3 3v11.5H8a3 3 0 0 0-3 3V4.5zm0 0v13.5A3 3 0 0 1 8 15h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-history" viewBox="0 0 24 24">
        <path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-back" viewBox="0 0 24 24">
        <path d="M10 6l-6 6 6 6M4 12h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-template" viewBox="0 0 24 24">
        <path d="M5 5h14v14H5zM9 5v14M15 5v14M5 9h14M5 15h14" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
    </svg>

    <header class="shell-header">
      <div class="brand-shell">
        <div class="brand-copy">
          <div class="brand-title">
            <img class="brand-logo" src="/static/favicon.svg" alt="" />
            <div>
              <h1>Local Sync Control Room</h1>
              <p class="brand-subtitle">Локальный `rclone copy` пульт для macOS.</p>
            </div>
          </div>
        </div>
      </div>
      <nav class="top-nav">
        <a href="/">Обзор</a>
        <a href="/jobs">Задачи</a>
        <a href="/runs">Запуски</a>
        <a href="/profiles">Профили</a>
        <a href="/setup">Подготовка</a>
        <a href="/ops">Ops / Runbook</a>
      </nav>
    </header>

    <main class="layout">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
